<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
</head>
<body>

<h2>Student Table</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.course }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
