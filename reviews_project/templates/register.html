<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <style>
    body{font-family: Inter, Arial; background: linear-gradient(135deg,#f6f8ff,#fff);}
    .card{max-width:420px;margin:60px auto;padding:24px;border-radius:12px;
          box-shadow:0 6px 20px rgba(30,60,120,0.08);background:#fff}
    h2{margin:0 0 12px;color:#0f172a}
    label{display:block;margin:10px 0 6px;color:#334155;font-size:14px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef}
    .btn{margin-top:16px;background:#4f46e5;color:#fff;padding:10px;border-radius:8px;border:none;width:100%;}
    .msg{padding:10px;border-radius:8px;margin-bottom:10px}
    .error{background:#fff1f2;color:#9f1239}
    .success{background:#ecfdf5;color:#065f46}
    .links{margin-top:12px;text-align:center}
    a{color:#4f46e5;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Create account</h2>
    {% for message in messages %}
      <div class="msg {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}
    <form method="POST">
      {% csrf_token %}
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Phone Number</label>
      <input type ="number" name="number" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button class="btn" type="submit">Register</button>
    </form>
    <div class="links">Already registered? <a href="{% url 'login' %}">Login</a></div>
  </div>
</body>
</html>
