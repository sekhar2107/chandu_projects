<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>

  <style>
    
    body{font-family: Inter, Arial;background: linear-gradient(135deg,#fff7ed,#fff)}
    .card{max-width:420px;margin:80px auto;padding:24px;border-radius:12px;
          box-shadow:0 6px 20px rgba(30,60,120,0.06);background:#fff}
    h2{margin:0 0 12px;color:#0f172a}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #e6e9ef;margin-bottom:8px}
    .btn{margin-top:8px;background:#06b6d4;color:#fff;padding:10px;border-radius:8px;border:none;width:100%;}
    .links{margin-top:12px;text-align:center}
    a{color:#06b6d4;text-decoration:none}
    .msg{padding:10px;border-radius:8px;margin-bottom:10px;color:red}

  </style>

  
</head>
<body>
  <div class="card">
    <h2>Welcome back</h2>
    {% for message in messages %}
      <div class="msg {% if message.tags %}{{ message.tags }}{% endif %}" style:"color=red">{{ message }}</div>
    {% endfor %}
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn" type="submit">Login</button>
    </form>
    
    <div class="links">New here? <a href="{% url 'register' %}">Create an account</a></div>
  
    </div>
</body>
</html>
